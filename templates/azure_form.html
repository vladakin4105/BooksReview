<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Încărcare Date Azure - Hackathon</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 mt-4">
                <div class="card shadow-sm border-primary">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0">Importă Date (Azure ADF) ☁️</h4>
                    </div>
                    
                    <div class="card-body p-4">
                        <p class="text-muted text-center mb-4">Alege fișierul CSV local. Acesta va fi salvat și pregătit pentru pipeline-ul din Azure Data Factory.</p>
                        
                        <!-- Afisare mesaj de succes daca exista -->
                        {% if mesaj_succes %}
                        <div class="alert alert-success text-center" role="alert">
                            {{ mesaj_succes }}
                        </div>
                        {% endif %}

                        <form action="/upload-azure" method="post" enctype="multipart/form-data">
                            <div class="mb-4">
                                <label for="fileUpload" class="form-label fw-bold">Selectează fișierul .csv</label>
                                <input class="form-control" type="file" id="fileUpload" name="file" accept=".csv" required>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Trimite Datele</button>
                                <a href="/" class="btn btn-outline-secondary">Înapoi la lista de cărți</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
